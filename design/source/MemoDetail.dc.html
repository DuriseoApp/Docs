<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메모 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B5666}a:hover{color:#1C1A22}
</style>
</helmet>
<main style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #1C1A22">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
<a href="Memo.dc.html" aria-label="뒤로 가기" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #1C1A22"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="display: flex; align-items: center">
<button type="button" aria-label="{{pinLabel}}" aria-pressed="{{isPinned}}" onClick="{{togglePin}}" style="width: 44px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{pinStroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 3 3v1.5H7V13l3-3z" fill="{{pinFill}}"></path><path d="M12 14.5V20"></path></svg>
</button>
<button type="button" aria-label="{{favLabel}}" aria-pressed="{{isFav}}" onClick="{{toggleFav}}" style="width: 44px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="{{starFill}}" stroke="{{starStroke}}" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.8l2.5 5.1 5.6.8-4 3.9 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4-3.9 5.6-.8z"></path></svg>
</button>
<sc-if value="{{mine}}" hint-placeholder-val="{{ true }}"><a href="AddEventMemoDate.dc.html" style="height: 48px; padding: 0 12px 0 6px; display: flex; align-items: center; text-decoration: none; color: #4A2FC0; font-size: 16px; font-weight: 700">수정</a></sc-if>
</span>
</header>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -0.01em">{{title}}</h1>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5B5666"><span style="{{dotStyle}}"></span>{{author}} · {{created}} 작성</span>
<sc-if value="{{hasDate}}" hint-placeholder-val="{{ true }}">
<span aria-label="메모 날짜 {{memoDate}}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 6px; background: #F5F3F7; font-size: 13px; font-weight: 600; color: #4A4553"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>{{memoDate}}</span>
</sc-if>
</div>
<p style="margin: 0; padding-top: 4px; border-top: 1px solid #EEEBF1; padding-top: 16px; font-size: 16px; line-height: 1.7; white-space: pre-line">{{body}}</p>
<sc-if value="{{readOnly}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #5B5666">상대가 쓴 메모는 상대만 고치거나 지울 수 있어요. 고정과 즐겨찾기는 할 수 있어요.</p>
</sc-if>
</div>
<sc-if value="{{mine}}" hint-placeholder-val="{{ true }}">
<div style="flex-shrink: 0; padding: 12px 20px 32px; border-top: 1px solid #EEEBF1">
<button type="button" onClick="{{openDialog}}" style="width: 100%; height: 52px; border-radius: 14px; border: 1px solid #E6E2EA; background: #FFFFFF; color: #B42335; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">메모 삭제</button>
</div>
</sc-if>
<sc-if value="{{dialogOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px">
<button type="button" onClick="{{closeDialog}}" aria-label="닫기" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(28, 26, 34, 0.48); cursor: default"></button>
<section role="alertdialog" aria-modal="true" aria-labelledby="dTitle" aria-describedby="dBody" style="position: relative; box-sizing: border-box; width: 100%; max-width: 320px; padding: 24px 20px 20px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 16px 40px rgba(28, 26, 34, 0.24); display: flex; flex-direction: column; gap: 8px">
<h2 id="dTitle" style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700">메모를 삭제할까요?</h2>
<p id="dBody" style="margin: 0; font-size: 15px; line-height: 24px; color: #5B5666">삭제하면 상대 메모장에서도 사라지고 되돌릴 수 없어요.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px">
<button type="button" onClick="{{closeDialog}}" style="height: 48px; border-radius: 14px; border: 1px solid #E6E2EA; background: #FFFFFF; color: #1C1A22; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">취소</button>
<a href="{{afterDelete}}" style="height: 48px; border-radius: 14px; background: #B42335; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">삭제</a>
</div>
</section>
</div>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#1C1A22","#0F8A6B"],"section":"앱"},"meColor":{"editor":"color","default":"#E0612F","options":["#E0612F","#D6336C","#2F9E44","#F59F00"],"section":"우리 색상"},"partnerColor":{"editor":"color","default":"#2F6FDB","options":["#2F6FDB","#0C8599","#AE3EC9","#8D6E63"],"section":"우리 색상"},"togetherColor":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#1C1A22","#D6336C","#2F9E44"],"section":"우리 색상"},"partner":{"editor":"boolean","default":false,"section":"상태"},"dialogOpen":{"editor":"boolean","default":false,"section":"상태"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#6D4AE0';
    const COLOR = { me: this.props.meColor ?? '#E0612F', partner: this.props.partnerColor ?? '#2F6FDB' };
    // 내 메모(날짜 있음)와 상대 메모(날짜 없음) 두 가지 예시. 체크리스트는 없다 (PRD D-19)
    const m = this.props.partner
      ? { who: 'partner', title: '장보기', body: '우유, 계란, 두부, 대파, 사과', author: '[상대 이름]', created: '오늘 오전 8:40', memoDate: '', pin: true, fav: false }
      : { who: 'me', title: '선물 아이디어', body: '향수 같이 시향해보기, 지난번에 본 머플러\n생일 전 주말에 같이 보러 가기', author: '[내 이름]', created: '10월 11일', memoDate: '11월 20일 (금)', pin: false, fav: true };
    const mine = m.who === 'me';
    const isPinned = s.pin !== undefined ? s.pin : m.pin;
    const isFav = s.fav !== undefined ? s.fav : m.fav;
    const dialogOpen = s.dialogOpen !== undefined ? !!s.dialogOpen : !!this.props.dialogOpen;
    return {
      accent,
      title: m.title,
      body: m.body,
      author: m.author,
      created: m.created,
      hasDate: !!m.memoDate,
      memoDate: m.memoDate,
      dotStyle: 'width: 7px; height: 7px; border-radius: 4px; flex-shrink: 0; background: ' + COLOR[m.who],
      mine,
      readOnly: !mine,
      isPinned,
      isFav,
      pinLabel: isPinned ? '고정 해제' : '상단에 고정',
      favLabel: isFav ? '즐겨찾기 해제' : '즐겨찾기',
      pinFill: isPinned ? accent : 'none',
      pinStroke: isPinned ? accent : '#5B5666',
      starFill: isFav ? '#C27803' : 'none',
      starStroke: isFav ? '#C27803' : '#5B5666',
      togglePin: () => this.setState({ pin: !isPinned }),
      toggleFav: () => this.setState({ fav: !isFav }),
      dialogOpen: mine && dialogOpen,
      openDialog: () => this.setState({ dialogOpen: true }),
      closeDialog: () => this.setState({ dialogOpen: false }),
      afterDelete: 'Memo.dc.html'
    };
  }
}
</script>
</body>
</html>
