<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>일정 · 메모 추가</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B5666}a:hover{color:#1C1A22}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #1C1A22">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
<a href="Calendar.dc.html" aria-label="닫기" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #1C1A22">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 700">{{headerTitle}}</h1>
<a href="Calendar.dc.html" style="height: 48px; padding: 0 14px; display: flex; align-items: center; text-decoration: none; color: #4A2FC0; font-size: 16px; font-weight: 700">저장</a>
</header>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 20px">
<sc-if value="{{showTabs}}" hint-placeholder-val="{{ true }}">
<div role="tablist" aria-label="종류" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #F5F3F7">
<button type="button" role="tab" aria-selected="{{isEvent}}" onClick="{{pickEvent}}" style="height: 40px; border: 0; border-radius: 11px; font-family: inherit; font-size: 15px; {{tabEventStyle}}">일정</button>
<button type="button" role="tab" aria-selected="{{isMemo}}" onClick="{{pickMemo}}" style="height: 40px; border: 0; border-radius: 11px; font-family: inherit; font-size: 15px; {{tabMemoStyle}}">메모</button>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="title" style="font-size: 13px; font-weight: 600; color: #5B5666">제목</label>
<input id="title" type="text" value="{{titleValue}}" placeholder="{{titlePlaceholder}}" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid #D9D4DF; font-family: inherit; font-size: 17px; color: #1C1A22; background: #FFFFFF">
</div>
<sc-if value="{{showWho}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 600; color: #5B5666">누구의 일정인가요?</span>
<a href="ColorSettings.dc.html" style="height: 36px; padding: 0 0 0 10px; display: flex; align-items: center; gap: 4px; text-decoration: none; color: #4A2FC0; font-size: 13px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.8 1.8-1.7 0-1.1-.9-1.5-.9-2.5 0-.9.7-1.6 1.6-1.6h2.1a3.9 3.9 0 0 0 3.9-3.9C20.5 6.6 16.7 3.5 12 3.5z"></path><circle cx="7.8" cy="11" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="11" cy="7.4" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="15.4" cy="8.3" r="1.2" fill="currentColor" stroke="none"></circle></svg>
색상 변경
</a>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{whos}}" as="w" hint-placeholder-count="2">
<button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="{{w.boxStyle}}">
<span style="{{w.dotStyle}}"></span>
<span>{{w.label}}</span>
<sc-if value="{{w.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1A22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5B5666">함께 일정은 두 사람 모두 수정할 수 있어요.</p>
</div>
</sc-if>
<sc-if value="{{isMemo}}" hint-placeholder-val="{{ false }}">
<sc-if value="{{noMemoDate}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<button type="button" onClick="{{addDate}}" style="height: 48px; border-radius: 14px; border: 1px dashed #B3AEBB; background: #FFFFFF; color: #1C1A22; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"></path></svg>
날짜 추가
</button>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5B5666">날짜를 넣으면 캘린더 그 날에도 보여요.</p>
</div>
</sc-if>
<sc-if value="{{hasMemoDate}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="height: 56px; padding: 0 4px 0 16px; border-radius: 16px; border: 1px solid #EEEBF1; display: flex; align-items: center; justify-content: space-between; font-size: 15px">
<span style="display: flex; align-items: center; gap: 12px; color: #5B5666"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>날짜</span>
<span style="display: flex; align-items: center">
<button type="button" style="height: 44px; padding: 0 4px; border: 0; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #1C1A22">2026년 10월 17일 (토)</button>
<button type="button" aria-label="날짜 빼기" onClick="{{removeDate}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #77727F; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>
</button>
</span>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5B5666">캘린더 10월 17일에 메모로 보여요.</p>
</div>
</sc-if>
</sc-if>
<sc-if value="{{partnerEdit}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #5B5666">누구의 일정</span>
<div style="display: flex; align-items: center; gap: 10px">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid #E6E2EA; font-size: 14px; font-weight: 600"><span style="{{togetherDot}}"></span>함께</span>
<span style="font-size: 12px; line-height: 1.5; color: #5B5666">함께 일정의 대상은 만든 사람만 바꿀 수 있어요.</span>
</div>
</div>
</sc-if>
<sc-if value="{{isEvent}}" hint-placeholder-val="{{ true }}">
<div style="border-radius: 16px; border: 1px solid #EEEBF1; display: flex; flex-direction: column">
<div style="height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 15px">
<span style="display: flex; align-items: center; gap: 12px; color: #5B5666"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>하루 종일</span>
<button type="button" aria-label="하루 종일" aria-pressed="{{allDay}}" onClick="{{toggleAllDay}}" style="width: 52px; height: 32px; border: 0; border-radius: 16px; padding: 3px; display: flex; font-family: inherit; {{switchStyle}}">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(28, 26, 34, 0.25)"></span>
</button>
</div>
<div style="min-height: 56px; padding: 0 10px 0 16px; border-top: 1px solid #EEEBF1; display: flex; align-items: center; justify-content: space-between; font-size: 15px">
<span style="display: flex; align-items: center; gap: 12px; color: #5B5666"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>시작</span>
<span style="display: flex; gap: 6px">
<button type="button" aria-label="시작 날짜 {{startDate}}" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: #F5F3F7; font-family: inherit; font-size: 15px; font-weight: 600; color: #1C1A22; cursor: pointer">{{startDate}}</button>
<sc-if value="{{showTime}}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="시작 시간 {{startTime}}" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: #F5F3F7; font-family: inherit; font-size: 15px; font-weight: 600; color: #1C1A22; cursor: pointer">{{startTime}}</button></sc-if>
</span>
</div>
<div style="min-height: 56px; padding: 0 10px 0 16px; border-top: 1px solid #EEEBF1; display: flex; align-items: center; justify-content: space-between; font-size: 15px">
<span style="padding-left: 32px; color: #5B5666">종료</span>
<span style="display: flex; gap: 6px">
<button type="button" aria-label="종료 날짜 {{endDate}}" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: #F5F3F7; font-family: inherit; font-size: 15px; font-weight: 600; color: #1C1A22; cursor: pointer">{{endDate}}</button>
<sc-if value="{{showTime}}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="종료 시간 {{endTime}}" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: #F5F3F7; font-family: inherit; font-size: 15px; font-weight: 600; color: #1C1A22; cursor: pointer">{{endTime}}</button></sc-if>
</span>
</div>
<button type="button" style="height: 56px; border: 0; border-top: 1px solid #EEEBF1; background: transparent; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-family: inherit; font-size: 15px; color: #1C1A22">
<span style="display: flex; align-items: center; gap: 12px; color: #5B5666"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg>내 알림</span>
<span style="font-weight: 600; color: {{reminderColor}}">{{reminderLabel}}</span>
</button>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="memo" style="font-size: 13px; font-weight: 600; color: #5B5666">메모</label>
<textarea id="memo" rows="2" value="{{memoValue}}" placeholder="상대에게 남길 내용을 적어주세요" style="box-sizing: border-box; padding: 14px 16px; border-radius: 14px; border: 1px solid #D9D4DF; font-family: inherit; font-size: 15px; line-height: 1.6; color: #1C1A22; background: #FFFFFF; resize: none"></textarea>
</div>
<sc-if value="{{showNotify}}" hint-placeholder-val="{{ true }}">
<div style="padding: 14px 16px; border-radius: 16px; border: 1px solid #EEEBF1; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">상대에게 알림 보내기</span>
<span style="font-size: 13px; color: #5B5666">저장하면 상대에게 푸시 알림이 가요</span>
</span>
<button type="button" aria-label="상대에게 알림 보내기" aria-pressed="{{notify}}" onClick="{{toggleNotify}}" style="width: 52px; height: 32px; flex-shrink: 0; border: 0; border-radius: 16px; padding: 3px; display: flex; font-family: inherit; {{notifyStyle}}">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(28, 26, 34, 0.25)"></span>
</button>
</div>
</sc-if>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#1C1A22","#0F8A6B"],"section":"앱"},"meColor":{"editor":"color","default":"#E0612F","options":["#E0612F","#D6336C","#2F9E44","#F59F00"],"section":"우리 색상"},"partnerColor":{"editor":"color","default":"#2F6FDB","options":["#2F6FDB","#0C8599","#AE3EC9","#8D6E63"],"section":"우리 색상"},"togetherColor":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#1C1A22","#D6336C","#2F9E44"],"section":"우리 색상"},"kind":{"editor":"enum","options":["event","memo"],"default":"event","section":"상태"},"solo":{"editor":"boolean","default":false,"section":"상태"},"memoDate":{"editor":"boolean","default":false,"section":"상태"},"partnerEdit":{"editor":"boolean","default":false,"section":"상태"},"allDay":{"editor":"boolean","default":false,"section":"상태"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6D4AE0';
    const colors = {
      me: this.props.meColor ?? '#E0612F',
      partner: this.props.partnerColor ?? '#2F6FDB',
      both: this.props.togetherColor ?? '#6D4AE0'
    };
    const s = this.state || {};
    const kind = s.kind || this.props.kind || 'event';
    const who = s.who || 'me';
    const solo = !!this.props.solo;
    const notify = s.notify !== undefined ? !!s.notify : true;
    const allDay = s.allDay !== undefined ? !!s.allDay : !!this.props.allDay;
    // 상대가 '함께' 일정을 수정할 때: 대상은 바꿀 수 없고 알림 스위치도 없다 (PRD D-52, FR-NOTI-04)
    const partnerEdit = !!this.props.partnerEdit;
    const isEvent = kind === 'event';
    // 메모 날짜는 기본으로 비어 있고 [날짜 추가]로 넣는다 (PRD FR-MEMO-01)
    const memoDate = s.memoDate !== undefined ? !!s.memoDate : !!this.props.memoDate;
    const on = 'background: #FFFFFF; color: #1C1A22; font-weight: 700; box-shadow: 0 1px 3px rgba(28, 26, 34, 0.12)';
    const off = 'background: transparent; color: #5B5666; font-weight: 500';
    const box = 'height: 48px; border-radius: 14px; font-family: inherit; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; background: #FFFFFF; ';
    // 일정 대상은 나 또는 함께만 고른다 (상대는 고를 수 없음, PRD D-34)
    const defs = [
      { id: 'me', label: '나' },
      { id: 'both', label: '함께' }
    ];
    const whos = defs.map((d) => {
      const sel = d.id === who;
      return {
        label: d.label,
        on: sel,
        pick: () => this.setState({ who: d.id }),
        boxStyle: box + (sel
          ? 'border: 2px solid #1C1A22; color: #1C1A22; font-weight: 700'
          : 'border: 1px solid #E6E2EA; color: #5B5666; font-weight: 500'),
        dotStyle: 'width: 14px; height: 14px; border-radius: 7px; flex-shrink: 0; background: ' + colors[d.id]
      };
    });
    return {
      isEvent,
      isMemo: !isEvent,
      hasMemoDate: memoDate,
      noMemoDate: !memoDate,
      addDate: () => this.setState({ memoDate: true }),
      removeDate: () => this.setState({ memoDate: false }),
      kindWord: isEvent ? '일정' : '메모',
      titlePlaceholder: isEvent ? '예) 저녁 데이트' : '예) 주말에 살 것',
      tabEventStyle: isEvent ? on : off,
      tabMemoStyle: isEvent ? off : on,
      pickEvent: () => this.setState({ kind: 'event' }),
      pickMemo: () => this.setState({ kind: 'memo' }),
      whos,
      showWho: isEvent && !solo && !partnerEdit,
      showNotify: !solo && !partnerEdit,
      partnerEdit,
      showTabs: !partnerEdit,
      headerTitle: partnerEdit ? '일정 수정' : '새로 추가',
      titleValue: partnerEdit ? '저녁 데이트' : '',
      memoValue: partnerEdit ? '[식당 이름] 예약 완료 · 7시 20분 역 앞에서' : '',
      togetherDot: 'width: 10px; height: 10px; border-radius: 5px; background: ' + colors.both,
      // 시작·종료 행 (PRD D-64). 종일이면 날짜만
      startDate: '10월 12일 (월)',
      endDate: '10월 12일 (월)',
      startTime: '오후 7:30',
      endTime: '오후 9:30',
      // 일정 알림 기본값은 없음 (PRD D-59)
      reminderLabel: '없음',
      reminderColor: '#5B5666',
      notify,
      toggleNotify: () => this.setState({ notify: !notify }),
      notifyStyle: notify ? 'background: ' + accent + '; justify-content: flex-end' : 'background: #D9D4DF; justify-content: flex-start',
      allDay,
      showTime: !allDay,
      toggleAllDay: () => this.setState({ allDay: !allDay }),
      switchStyle: allDay ? 'background: ' + accent + '; justify-content: flex-end' : 'background: #D9D4DF; justify-content: flex-start'
    };
  }
}
</script>
</body>
</html>
