<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B5666}a:hover{color:#1C1A22}
</style>
</helmet>
<main style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 96px 24px 32px; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #1C1A22">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 28px; flex-grow: 1">
<svg width="112" height="72" viewBox="0 0 112 72" role="img" aria-label="두 원이 겹친 둘이서 로고">
<defs><clipPath id="leftCircle"><circle cx="38" cy="36" r="34"></circle></clipPath></defs>
<circle cx="38" cy="36" r="34" fill="#E0612F"></circle>
<circle cx="74" cy="36" r="34" fill="#2F6FDB"></circle>
<circle cx="74" cy="36" r="34" fill="{{accent}}" clip-path="url(#leftCircle)"></circle>
</svg>
<div style="display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 40px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">둘이서</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: #5B5666">일정도, 공지도, 메모도<br>우리 둘만 보는 공간에.</p>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="padding: 6px 12px; border-radius: 999px; background: #F5F3F7; font-size: 13px; font-weight: 500; color: #5B5666">쉐어 캘린더</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #F5F3F7; font-size: 13px; font-weight: 500; color: #5B5666">공지사항</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #F5F3F7; font-size: 13px; font-weight: 500; color: #5B5666">메모장</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0 0 4px; font-size: 13px; color: #77727F; text-align: center">간편하게 시작하기</p>
<a href="Connect.dc.html" aria-label="{{googleLabel}}" style="position: relative; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #1C1A22; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600">Google로 계속하기<sc-if value="{{googleLast}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -9px; right: 14px; padding: 2px 8px; border-radius: 999px; background: #6D4AE0; color: #FFFFFF; font-size: 11px; line-height: 16px; font-weight: 600">최근 사용</span></sc-if></a>
<a href="Connect.dc.html" aria-label="{{kakaoLabel}}" style="position: relative; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; border: 1px solid #E6E2EA; color: #1C1A22; text-decoration: none; font-size: 16px; font-weight: 600">카카오로 계속하기<sc-if value="{{kakaoLast}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -9px; right: 14px; padding: 2px 8px; border-radius: 999px; background: #6D4AE0; color: #FFFFFF; font-size: 11px; line-height: 16px; font-weight: 600">최근 사용</span></sc-if></a>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 4px; color: #77727F; font-size: 12px" aria-hidden="true">
<span style="flex-grow: 1; height: 1px; background: #EEEBF1"></span>또는<span style="flex-grow: 1; height: 1px; background: #EEEBF1"></span>
</div>
<a href="Connect.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 14px; background: #F5F3F7; color: #1C1A22; text-decoration: none; font-size: 15px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
게스트로 시작하기
</a>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5B5666; text-align: center">로그인 없이 바로 써볼 수 있어요. 나중에 메뉴 › 계정에서<br>로그인하면 지금까지의 기록이 그대로 옮겨져요.</p>
<p style="margin: 6px 0 0; font-size: 12px; line-height: 1.6; color: #77727F; text-align: center">시작하면 만 14세 이상이며, <a href="#terms">이용약관</a>과<br><a href="#privacy">개인정보처리방침</a>에 동의하는 것으로 봐요.</p>
</div>
<sc-if value="{{replaced}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 16px; right: 16px; top: 40px; box-sizing: border-box; padding: 14px 16px; border-radius: 14px; background: #1C1A22; color: #FFFFFF; font-size: 14px; line-height: 1.5; box-shadow: 0 6px 16px rgba(28, 26, 34, 0.18)">다른 기기에서 로그인해서 로그아웃됐어요</div>
</sc-if>
<sc-if value="{{otherOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
<button type="button" aria-label="닫기" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(28, 26, 34, 0.48); cursor: default"></button>
<section role="alertdialog" aria-modal="true" aria-labelledby="omT" aria-describedby="omB" style="position: relative; box-sizing: border-box; width: 100%; max-width: 320px; padding: 24px 20px 20px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 16px 40px rgba(28, 26, 34, 0.24); display: flex; flex-direction: column; gap: 8px">
<h2 id="omT" style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700">{{otherTitle}}</h2>
<p id="omB" style="margin: 0; font-size: 15px; line-height: 24px; color: #5B5666">{{otherBody}}</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px">
<button type="button" style="height: 48px; border-radius: 14px; border: 1px solid #E6E2EA; background: #FFFFFF; color: #1C1A22; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">취소</button>
<a href="Connect.dc.html" style="height: 48px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{otherAction}}</a>
</div>
</section>
</div>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#1C1A22","#0F8A6B"]},"replaced":{"editor":"boolean","default":false,"section":"상태"},"lastUsed":{"editor":"enum","options":["none","google","kakao"],"default":"none","section":"상태"},"otherDialog":{"editor":"boolean","default":false,"section":"상태"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
// 다른 기기 로그인으로 끊긴 경우 (PRD D-51)
// 최근 로그인 수단 (PRD FR-AUTH-10, D-188): 기억한 버튼에 "최근 사용" 배지,
// 다른 수단을 누르면 확인 다이얼로그 (otherDialog는 기억한 수단이 아닌 쪽을 눌렀을 때)
const last = this.props.lastUsed ?? 'none';
const name = { google: 'Google', kakao: '카카오' };
const other = last === 'kakao' ? 'google' : 'kakao';
const lastName = name[last] ?? '';
const otherName = name[other];
return {
  accent: this.props.accent ?? '#6D4AE0',
  replaced: !!this.props.replaced,
  googleLast: last === 'google',
  kakaoLast: last === 'kakao',
  googleLabel: last === 'google' ? 'Google로 계속하기, 최근 사용' : 'Google로 계속하기',
  kakaoLabel: last === 'kakao' ? '카카오로 계속하기, 최근 사용' : '카카오로 계속하기',
  otherOpen: !!this.props.otherDialog && last !== 'none',
  otherTitle: '이 기기에서는 ' + lastName + '로 로그인했어요',
  otherBody: '다른 계정으로 로그인하면 새 계정이 만들어질 수 있어요. ' + otherName + '로 계속할까요?',
  otherAction: otherName + '로 계속'
};
}
}
</script>
</body>
</html>
