<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팝업 배너 이미지 예시</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
<sc-if value="{{show_maintenance}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<svg width="280" height="350" viewBox="0 0 280 350" role="img" aria-label="서비스 점검 안내 배너 예시" style="display: block; border-radius: 16px">
<rect width="280" height="350" fill="#F3F0FD"></rect>
<circle cx="140" cy="118" r="66" fill="#ECE6FC"></circle>
<g fill="#6D4AE0">
<rect x="131" y="66" width="18" height="24" rx="6"></rect>
<rect x="131" y="66" width="18" height="24" rx="6" transform="rotate(45 140 118)"></rect>
<rect x="131" y="66" width="18" height="24" rx="6" transform="rotate(90 140 118)"></rect>
<rect x="131" y="66" width="18" height="24" rx="6" transform="rotate(135 140 118)"></rect>
<rect x="131" y="66" width="18" height="24" rx="6" transform="rotate(180 140 118)"></rect>
<rect x="131" y="66" width="18" height="24" rx="6" transform="rotate(225 140 118)"></rect>
<rect x="131" y="66" width="18" height="24" rx="6" transform="rotate(270 140 118)"></rect>
<rect x="131" y="66" width="18" height="24" rx="6" transform="rotate(315 140 118)"></rect>
<circle cx="140" cy="118" r="34"></circle>
</g>
<circle cx="140" cy="118" r="13" fill="#ECE6FC"></circle>
<text x="140" y="232" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="24" font-weight="700" fill="#1C1A22">서비스 점검 안내</text>
<text x="140" y="268" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="15" font-weight="600" fill="#4A2FC0">[날짜] 02:00 ~ 04:00</text>
<text x="140" y="300" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="14" fill="#5B5666">점검하는 동안에는 앱을 쓸 수 없어요</text>
</svg>
<sc-if value="{{showLabel}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #5B5666">maintenance</span></sc-if>
</div>
</sc-if>
<sc-if value="{{show_notice}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<svg width="280" height="350" viewBox="0 0 280 350" role="img" aria-label="알림 지연 안내 배너 예시" style="display: block; border-radius: 16px">
<rect width="280" height="350" fill="#F3F0FD"></rect>
<circle cx="140" cy="118" r="66" fill="#ECE6FC"></circle>
<circle cx="140" cy="70" r="8" fill="#6D4AE0"></circle>
<path d="M140 74C119 74 106 90 106 110V128L95 144H185L174 128V110C174 90 161 74 140 74Z" fill="#6D4AE0" stroke="#6D4AE0" stroke-width="6" stroke-linejoin="round"></path>
<path d="M126 152H154A14 14 0 0 1 126 152Z" fill="#4A2FC0"></path>
<text x="140" y="232" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="24" font-weight="700" fill="#1C1A22">알림 지연 안내</text>
<text x="140" y="268" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="15" font-weight="600" fill="#4A2FC0">일부 알림이 늦게 도착해요</text>
<text x="140" y="300" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="14" fill="#5B5666">일정과 메모는 평소처럼 쓸 수 있어요</text>
</svg>
<sc-if value="{{showLabel}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #5B5666">notice</span></sc-if>
</div>
</sc-if>
<sc-if value="{{show_update}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<svg width="280" height="350" viewBox="0 0 280 350" role="img" aria-label="새 버전 안내 배너 예시" style="display: block; border-radius: 16px">
<rect width="280" height="350" fill="#6D4AE0"></rect>
<circle cx="140" cy="118" r="66" fill="#4A2FC0"></circle>
<rect x="108" y="66" width="64" height="104" rx="16" fill="#FFFFFF"></rect>
<path d="M140 146V96M122 114L140 96L158 114" stroke="#6D4AE0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
<text x="140" y="232" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">새 버전이 나왔어요</text>
<text x="140" y="268" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="15" font-weight="600" fill="#ECE6FC">업데이트하고 계속 써 주세요</text>
</svg>
<sc-if value="{{showLabel}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #5B5666">update</span></sc-if>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"all","options":["all","maintenance","notice","update"]},"$preview":{"width":936,"height":422}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'all';
    const all = kind === 'all';
    return {
      showLabel: all,
      rootStyle: all
        ? 'box-sizing: border-box; width: 936px; height: 422px; padding: 24px; display: flex; gap: 24px; background: #FFFFFF'
        : 'display: flex; width: 280px; height: 350px',
      show_maintenance: all || kind === 'maintenance',
      show_notice: all || kind === 'notice',
      show_update: all || kind === 'update',
    };
  }
}
</script>
</body>
</html>
