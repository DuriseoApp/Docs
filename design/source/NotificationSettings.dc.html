<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>알림 설정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B5666}a:hover{color:#1C1A22}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #1C1A22">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
<a href="Menu.dc.html" aria-label="뒤로 가기" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #1C1A22"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 700">알림 설정</h1>
<span style="width: 48px" aria-hidden="true"></span>
</header>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 16px">
<section aria-label="알림 종류" style="border-radius: 16px; border: 1px solid #EEEBF1; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="{{r.rowStyle}}">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">{{r.label}}</span>
<span style="font-size: 13px; line-height: 1.5; color: #5B5666">{{r.desc}}</span>
</span>
<button type="button" role="switch" aria-label="{{r.label}}" aria-checked="{{r.on}}" onClick="{{r.toggle}}" style="width: 52px; height: 32px; flex-shrink: 0; border: 0; border-radius: 16px; padding: 3px; display: flex; font-family: inherit; cursor: pointer; {{r.switchStyle}}">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(28, 26, 34, 0.25)"></span>
</button>
</div>
</sc-for>
</section>
<ul style="margin: 0; padding: 0 4px; list-style: none; display: flex; flex-direction: column; gap: 6px">
<li style="display: flex; gap: 8px; font-size: 13px; line-height: 1.6; color: #5B5666"><span style="color: #8E8996; flex-shrink: 0; padding-top: 1px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span>연결·해제 알림은 끌 수 없어요.</li>
<li style="display: flex; gap: 8px; font-size: 13px; line-height: 1.6; color: #5B5666"><span style="color: #8E8996; flex-shrink: 0; padding-top: 1px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg></span>꺼도 알림 목록에는 남아요</li>
</ul>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#1C1A22","#0F8A6B"],"section":"앱"},"mixed":{"editor":"boolean","default":false,"section":"상태"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6D4AE0';
    const s = this.state || {};
    // 기본은 모두 켜짐 (PRD 8장). mixed는 켜짐·꺼짐이 섞인 예시
    const DEF = [
      { id: 'reminder', label: '일정 알림', desc: '내가 정한 시각에 일정을 알려줘요' },
      { id: 'partner', label: '상대 일정·메모 추가', desc: '상대가 알림을 보내며 추가하면 알려줘요' },
      { id: 'pin', label: '메모 고정', desc: '상대가 메모를 고정하면 알려줘요' },
      { id: 'anniv', label: '기념일', desc: '기념일 당일 오전 9시에 알려줘요' }
    ];
    const init = this.props.mixed ? { reminder: true, partner: false, pin: false, anniv: true } : { reminder: true, partner: true, pin: true, anniv: true };
    const on = s.on || init;
    const rows = DEF.map((d, i) => ({
      label: d.label,
      desc: d.desc,
      on: !!on[d.id],
      toggle: () => this.setState({ on: { ...on, [d.id]: !on[d.id] } }),
      rowStyle: 'min-height: 76px; box-sizing: border-box; padding: 14px 16px; display: flex; align-items: center; gap: 12px' + (i ? '; border-top: 1px solid #EEEBF1' : ''),
      switchStyle: on[d.id] ? 'background: ' + accent + '; justify-content: flex-end' : 'background: #D9D4DF; justify-content: flex-start'
    }));
    return { accent, rows };
  }
}
</script>
</body>
</html>
