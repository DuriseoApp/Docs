<a href="ColorSettings.dc.html" style="height: 60px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1C1A22">
<span style="display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.8 1.8-1.7 0-1.1-.9-1.5-.9-2.5 0-.9.7-1.6 1.6-1.6h2.1a3.9 3.9 0 0 0 3.9-3.9C20.5 6.6 16.7 3.5 12 3.5z"></path><circle cx="7.8" cy="11" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="11" cy="7.4" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="15.4" cy="8.3" r="1.2" fill="currentColor" stroke="none"></circle></svg>
우리 색상
</span>
<span style="display: flex; align-items: center; gap: 10px">
<span style="display: flex; gap: 4px" aria-label="현재 색상: 나, 상대, 함께">
<span style="{{meDot}}"></span><span style="{{partnerDot}}"></span><span style="{{togetherDot}}"></span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8996" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</span>
</a>
</section>
<section aria-labelledby="setTitle" style="display: flex; flex-direction: column">
<h2 id="setTitle" style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #77727F">설정</h2>
<a href="#notify" style="height: 60px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1C1A22">
<span style="display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg>알림 설정</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8996" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="#link" style="height: 60px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1C1A22">
<span style="display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>연결 정보</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #77727F">연결 해제<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8996" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span>
</a>

<h2 id="etcTitle" style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #77727F">정보</h2>

<div style="display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid #EEEBF1">
<a href="Main.dc.html" style="height: 48px; display: flex; align-items: center; text-decoration: none; color: #B42335; font-size: 15px; font-weight: 600">로그아웃</a>
<span style="font-size: 12px; color: #77727F">버전 1.0.0</span>
</div>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"meColor":{"editor":"color","default":"#E0612F","options":["#E0612F","#D6336C","#2F9E44","#F59F00"],"section":"우리 색상"},"partnerColor":{"editor":"color","default":"#2F6FDB","options":["#2F6FDB","#0C8599","#AE3EC9","#8D6E63"],"section":"우리 색상"},"togetherColor":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#1C1A22","#D6336C","#2F9E44"],"section":"우리 색상"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const me = this.props.meColor ?? '#E0612F';
    const partner = this.props.partnerColor ?? '#2F6FDB';
    const together = this.props.togetherColor ?? '#6D4AE0';
    const onColor = (hex) => {
      const h = String(hex || '').replace('#', '');
      if (h.length !== 6) return '#FFFFFF';
      const lin = (v) => { const c = parseInt(v, 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
      const L = 0.2126 * lin(h.slice(0, 2)) + 0.7152 * lin(h.slice(2, 4)) + 0.0722 * lin(h.slice(4, 6));
      return L > 0.2 ? '#1C1A22' : '#FFFFFF';
    };
    const avatar = (c, overlap) => 'width: 44px; height: 44px; border-radius: 22px; background: ' + c + '; color: ' + onColor(c) + '; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #F5F3F7' + (overlap ? '; margin-left: -10px' : '');
    const dot = (c) => 'width: 14px; height: 14px; border-radius: 7px; background: ' + c;
    return {
      meAvatarStyle: avatar(me, false),
      partnerAvatarStyle: avatar(partner, true),
      meDot: dot(me),
      partnerDot: dot(partner),
      togetherDot: dot(together)
    };
  }
}
</script>
</body>
</html>
