<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>초대코드 입력하기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B5666}a:hover{color:#1C1A22}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #1C1A22">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; padding: 0 8px">
<a href="Connect.dc.html" aria-label="뒤로 가기" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #1C1A22">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
</header>
<div style="flex-grow: 1; padding: 12px 24px 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700; letter-spacing: -0.01em">받은 초대코드를<br>입력해 주세요</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5B5666">영문과 숫자 6자리예요.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<label for="inviteCode" style="font-size: 13px; font-weight: 600; color: #5B5666">초대코드</label>
<div style="position: relative; display: flex; gap: 8px">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
<span style="{{b.style}}">{{b.ch}}</span>
</sc-for>
<input id="inviteCode" type="text" autocomplete="off" value="{{code}}" onChange="{{onCode}}" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; font-size: 16px">
</div>
<button type="button" onClick="{{paste}}" style="align-self: flex-start; height: 44px; padding: 0 14px 0 10px; border-radius: 12px; border: 1px solid #E6E2EA; background: #FFFFFF; color: #1C1A22; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5" width="13" height="16" rx="2"></rect><path d="M9 3.5h6v3H9z"></path></svg>
붙여넣기
</button>
</div>
<sc-if value="{{complete}}" hint-placeholder-val="{{ false }}">
<section aria-label="연결할 상대" style="padding: 16px 18px; border-radius: 18px; background: #F5F3F7; display: flex; align-items: center; gap: 14px">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #2F6FDB; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">너</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #5B5666">연결할 상대</span>
<span style="font-size: 16px; font-weight: 700">[상대 이름]</span>
</span>
<button type="button" onClick="{{clear}}" style="height: 44px; padding: 0 10px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #5B5666">다시 입력</button>
</section>
</sc-if>
</div>
<div style="padding: 16px 24px 32px">
<sc-if value="{{complete}}" hint-placeholder-val="{{ false }}">
<a href="Connected.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700">연결하고 시작하기</a>
</sc-if>
<sc-if value="{{incomplete}}" hint-placeholder-val="{{ true }}">
<button type="button" disabled style="width: 100%; height: 56px; border: 0; border-radius: 16px; background: #EEEBF1; color: #77727F; font-family: inherit; font-size: 16px; font-weight: 700">연결하고 시작하기</button>
</sc-if>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#1C1A22","#0F8A6B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6D4AE0';
    const code = (this.state && this.state.code) || '';
    const clean = (v) => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    const boxes = [0, 1, 2, 3, 4, 5].map((i) => {
      const ch = code[i] || '';
      const active = code.length < 6 && i === code.length;
      const border = active ? '2px solid ' + accent : (ch ? '1px solid #D9D4DF' : '1px solid #F5F3F7');
      return {
        ch,
        style: "flex: 1; height: 58px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 500; color: #1C1A22; background: " + (ch ? '#FFFFFF' : '#F5F3F7') + '; border: ' + border
      };
    });
    return {
      accent,
      code,
      boxes,
      complete: code.length === 6,
      incomplete: code.length < 6,
      onCode: (e) => this.setState({ code: clean(e && e.target ? e.target.value : '') }),
      paste: () => this.setState({ code: 'K7Q29X' }),
      clear: () => this.setState({ code: '' })
    };
  }
}
</script>
</body>
</html>
