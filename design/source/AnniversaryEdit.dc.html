<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기념일 추가</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B5666}a:hover{color:#1C1A22}
</style>
</helmet>
<main style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #1C1A22">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
<a href="Anniversaries.dc.html" aria-label="닫기" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #1C1A22">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 700">{{titleText}}</h1>
<a href="Anniversaries.dc.html" style="height: 48px; padding: 0 14px; display: flex; align-items: center; text-decoration: none; color: #4A2FC0; font-size: 16px; font-weight: 700">저장</a>
</header>
<div style="flex-grow: 1; padding: 8px 20px 28px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<label for="annivName" style="font-size: 13px; font-weight: 600; color: #5B5666">이름</label>
<span style="font-size: 12px; font-weight: 500; color: #77727F">{{countLabel}}</span>
</div>
<input id="annivName" type="text" value="{{name}}" placeholder="예) 처음 여행 간 날" onChange="{{onName}}" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid #D9D4DF; font-family: inherit; font-size: 16px; color: #1C1A22; background: #FFFFFF">
</div>
<div style="border-radius: 16px; border: 1px solid #EEEBF1; display: flex; flex-direction: column">
<button type="button" style="height: 56px; border: 0; background: transparent; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-family: inherit; font-size: 15px; color: #1C1A22">
<span style="display: flex; align-items: center; gap: 12px; color: #5B5666"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>날짜</span>
<span style="font-weight: 600">2026년 12월 5일 (토)</span>
</button>
<div style="min-height: 56px; padding: 10px 16px; box-sizing: border-box; border-top: 1px solid #EEEBF1; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 12px; font-size: 15px; color: #5B5666"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"></path><path d="M20 4v4.5h-4.5"></path><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"></path><path d="M4 20v-4.5h4.5"></path></svg>매년 반복</span>
</span>
<button type="button" aria-label="매년 반복" aria-pressed="{{yearly}}" onClick="{{toggleYearly}}" style="width: 52px; height: 32px; flex-shrink: 0; border: 0; border-radius: 16px; padding: 3px; display: flex; font-family: inherit; {{yearlyStyle}}">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(28, 26, 34, 0.25)"></span>
</button>
</div>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5B5666">{{guide}}</p>
<sc-if value="{{isEdit}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{openDelete}}" style="margin-top: auto; height: 52px; border-radius: 16px; border: 1px solid #E6E2EA; background: #FFFFFF; color: #B42335; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">기념일 삭제</button>
</sc-if>
</div>
<sc-if value="{{deleteOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px">
<button type="button" onClick="{{closeDelete}}" aria-label="닫기" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(28, 26, 34, 0.48); cursor: default"></button>
<section role="alertdialog" aria-modal="true" aria-labelledby="adT" aria-describedby="adB" style="position: relative; box-sizing: border-box; width: 100%; max-width: 320px; padding: 24px 20px 20px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 16px 40px rgba(28, 26, 34, 0.24); display: flex; flex-direction: column; gap: 8px">
<h2 id="adT" style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700">기념일을 삭제할까요?</h2>
<p id="adB" style="margin: 0; font-size: 15px; line-height: 24px; color: #5B5666">[기념일 이름]이 캘린더와 기념일 목록에서 사라져요.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px">
<button type="button" onClick="{{closeDelete}}" style="height: 48px; border-radius: 14px; border: 1px solid #E6E2EA; background: #FFFFFF; color: #1C1A22; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">취소</button>
<a href="Anniversaries.dc.html" style="height: 48px; border-radius: 14px; background: #B42335; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">삭제</a>
</div>
</section>
</div>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#1C1A22","#0F8A6B"],"section":"앱"},"mode":{"editor":"enum","options":["add","edit"],"default":"add","section":"상태"},"solo":{"editor":"boolean","default":false,"section":"상태"},"deleteOpen":{"editor":"boolean","default":false,"section":"상태"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#6D4AE0';
    const isEdit = this.props.mode === 'edit';
    const MAX = 30;
    const name = s.name !== undefined ? s.name : (this.props.solo ? '엄마 생신' : '처음 여행 간 날');
    const solo = !!this.props.solo;
    const deleteOpen = s.deleteOpen !== undefined ? !!s.deleteOpen : !!this.props.deleteOpen;
    const yearly = s.yearly !== undefined ? !!s.yearly : true;
    return {
      isEdit,
      // 개인 공간 문구 (PRD D-54). 저장 뒤 처음이면 알림 권한을 묻는다 (D-70)
      guide: solo ? '캘린더와 기념일 목록에 표시되고, 당일 오전 9시에 알려 드려요. 2월 29일은 윤년이 아닌 해에 2월 28일로 표시돼요.' : '캘린더와 기념일 목록에 표시되고, 당일 오전 9시에 두 사람 모두에게 알림이 가요. 2월 29일은 윤년이 아닌 해에 2월 28일로 표시돼요.',
      deleteOpen: isEdit && deleteOpen,
      openDelete: () => this.setState({ deleteOpen: true }),
      closeDelete: () => this.setState({ deleteOpen: false }),
      titleText: isEdit ? '기념일 수정' : '기념일 추가',
      name,
      countLabel: name.length + ' / ' + MAX,
      onName: (e) => this.setState({ name: String(e && e.target ? e.target.value : '').slice(0, MAX) }),
      yearly,
      toggleYearly: () => this.setState({ yearly: !yearly }),
      yearlyStyle: yearly ? 'background: ' + accent + '; justify-content: flex-end' : 'background: #D9D4DF; justify-content: flex-start'
    };
  }
}
</script>
</body>
</html>
