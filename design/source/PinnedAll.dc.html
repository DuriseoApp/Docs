<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>고정된 메모</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B5666}a:hover{color:#1C1A22}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #1C1A22">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
<a href="Memo.dc.html" aria-label="뒤로 가기" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #1C1A22">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 700">고정된 메모 {{count}}</h1>
<span style="width: 48px" aria-hidden="true"></span>
</header>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0 0 4px; font-size: 13px; color: #5B5666">최근에 고정한 순서예요. 핀을 누르면 고정이 풀려요.</p>
<sc-for list="{{pins}}" as="p" hint-placeholder-count="4">
<article style="padding: 14px 6px 16px 16px; border-radius: 20px; background: #F3F0FD; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5B5666">
<span style="{{p.avatarStyle}}">{{p.avatar}}</span>{{p.whoText}} · {{p.date}}
</span>
<button type="button" aria-label="고정 해제" aria-pressed="true" onClick="{{p.unpin}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 3 3v1.5H7V13l3-3z" fill="{{accent}}"></path><path d="M12 14.5V20"></path></svg>
</button>
</div>
<div style="padding-right: 10px; display: flex; flex-direction: column; gap: 4px">
<a href="MemoDetail.dc.html" style="display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #1C1A22">
<h2 style="margin: 0; font-size: 17px; line-height: 1.4; font-weight: 700">{{p.title}}</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #4A4553; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{p.preview}}</p>
</a>
<sc-if value="{{p.hasDate}}" hint-placeholder-val="{{ false }}">
<span aria-label="{{p.dateAria}}" style="align-self: flex-start; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; color: #4A4553; background: #FFFFFF"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>{{p.memoDate}}</span>
</sc-if>
</div>
</article>
</sc-for>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 32px 0; text-align: center; font-size: 14px; line-height: 1.6; color: #5B5666">고정된 메모가 없어요.</p>
</sc-if>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#1C1A22","#0F8A6B"],"section":"앱"},"meColor":{"editor":"color","default":"#E0612F","options":["#E0612F","#D6336C","#2F9E44","#F59F00"],"section":"우리 색상"},"partnerColor":{"editor":"color","default":"#2F6FDB","options":["#2F6FDB","#0C8599","#AE3EC9","#8D6E63"],"section":"우리 색상"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#6D4AE0';
    const COLOR = { me: this.props.meColor ?? '#E0612F', partner: this.props.partnerColor ?? '#2F6FDB' };
    // 최근에 고정한 순서 (메모 목록과 같은 예시)
    const ALL = [
      { id: 2, who: 'partner', title: '장보기', preview: '우유, 계란, 두부, 대파, 사과', date: '오늘 오전 8:40' },
      { id: 1, who: 'partner', title: '여행 숙소 후보 정리했어', preview: '세 곳 골라놨는데 주말 전까지 하나 골라줘!', date: '오늘 오전 9:12', memoDate: '10월 16일 (금)' },
      { id: 5, who: 'me', title: '주말 집안일 분담', preview: '토요일 장보기는 내가, 일요일 청소는 같이 하기', date: '10월 8일' },
      { id: 8, who: 'me', title: '이번 달 데이트 통장 정리', preview: '이번 달은 여행 때문에 조금 더 넣기로 했어요. 금액은 [금액]으로 맞춰요.', date: '10월 1일' }
    ];
    const removed = s.removed || {};
    const list = ALL.filter((x) => !removed[x.id]);
    const pins = list.map((x) => ({
      title: x.title,
      preview: x.preview,
      date: x.date,
      hasDate: !!x.memoDate,
      memoDate: x.memoDate || '',
      dateAria: x.memoDate ? '메모 날짜 ' + x.memoDate : '',
      // 작성자는 닉네임으로 (PRD D-57)
      whoText: x.who === 'me' ? '[내 이름]' : '[상대 이름]',
      avatar: x.who === 'me' ? '나' : '너',
      avatarStyle: 'width: 24px; height: 24px; border-radius: 12px; background: ' + COLOR[x.who] + '; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center',
      unpin: () => this.setState({ removed: { ...removed, [x.id]: true } })
    }));
    return { accent, pins, count: pins.length, isEmpty: pins.length === 0 };
  }
}
</script>
</body>
</html>
