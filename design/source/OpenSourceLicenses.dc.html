<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오픈소스 라이선스</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B5666}a:hover{color:#1C1A22}
</style>
</helmet>
<main style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #1C1A22">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
<a href="Menu.dc.html" aria-label="뒤로 가기" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #1C1A22"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 700">오픈소스 라이선스</h1>
<span style="width: 48px" aria-hidden="true"></span>
</header>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="{{r.wrapStyle}}">
<button type="button" onClick="{{r.toggle}}" aria-expanded="{{r.open}}" aria-label="{{r.aria}}" style="width: 100%; height: 52px; padding: 0; border: 0; background: transparent; font-family: inherit; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; color: #1C1A22; cursor: pointer">
<span style="min-width: 0; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #77727F">{{r.license}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8996" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
</button>
<sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0 0 16px; padding: 16px; border-radius: 12px; background: #F7F6F9; font-size: 13px; line-height: 1.6; color: #5B5666; white-space: pre-line; word-break: break-word">[라이선스 전문]</p>
</sc-if>
</div>
</sc-for>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"openRow":{"editor":"number","default":0,"section":"상태"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    // 앱에서 쓰는 라이브러리와 글꼴의 라이선스 목록 (PRD FR-SET-02 AC3, D-152). 하단 탭 없음
    // 라이브러리는 구현 때 정해져서 자리표시. 글꼴은 이름 그대로
    const LIST = [
      { name: '[라이브러리 이름]', license: '[라이선스 이름]' },
      { name: '[라이브러리 이름]', license: '[라이선스 이름]' },
      { name: '[라이브러리 이름]', license: '[라이선스 이름]' },
      { name: '[라이브러리 이름]', license: '[라이선스 이름]' },
      { name: 'IBM Plex Sans KR', license: 'SIL OFL 1.1' },
      { name: 'IBM Plex Mono', license: 'SIL OFL 1.1' }
    ];
    // 행을 누르면 라이선스 전문이 행 아래로 펼쳐진다. openRow: 펼친 행 번호(1부터, 0은 모두 접힘)
    const openRow = s.openRow !== undefined ? s.openRow : (Number(this.props.openRow) || 0);
    const rows = LIST.map((l, i) => {
      const open = openRow === i + 1;
      return {
        name: l.name,
        license: l.license,
        aria: l.name + ', ' + l.license,
        open,
        icon: open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
        wrapStyle: 'display: flex; flex-direction: column' + (i ? '; border-top: 1px solid #EEEBF1' : ''),
        toggle: () => this.setState({ openRow: open ? 0 : i + 1 })
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
