<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>처음 만난 날 선택 시트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B5666}a:hover{color:#1C1A22}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; font-family: 'IBM Plex Sans KR', sans-serif; color: #1C1A22">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(28, 26, 34, 0.48)"></div>
<section role="dialog" aria-modal="true" aria-labelledby="sdsTitle" style="position: relative; box-sizing: border-box; padding: 10px 24px 28px; border-radius: 24px 24px 0 0; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #D9D4DF"></span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 id="sdsTitle" style="margin: 4px 0 0; font-size: 22px; line-height: 1.35; font-weight: 700; letter-spacing: -0.01em">처음 만난 날</h2>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #5B5666">D-day와 기념일이 이 날을 1일로 계산돼요.</p>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="연도와 월 고르기, {{monthLabel}}" style="height: 44px; padding: 0 6px 0 0; border: 0; background: transparent; font-family: inherit; font-size: 17px; font-weight: 700; color: #1C1A22; display: flex; align-items: center; gap: 4px; cursor: pointer">{{monthLabel}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<span style="display: flex">
<button type="button" aria-label="이전 달" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #5B5666; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button type="button" aria-label="다음 달" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #5B5666; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; text-align: center">
<span style="height: 28px; font-size: 12px; font-weight: 600; color: #C93545">일</span><span style="height: 28px; font-size: 12px; font-weight: 600; color: #77727F">월</span><span style="height: 28px; font-size: 12px; font-weight: 600; color: #77727F">화</span><span style="height: 28px; font-size: 12px; font-weight: 600; color: #77727F">수</span><span style="height: 28px; font-size: 12px; font-weight: 600; color: #77727F">목</span><span style="height: 28px; font-size: 12px; font-weight: 600; color: #77727F">금</span><span style="height: 28px; font-size: 12px; font-weight: 600; color: #77727F">토</span>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<button type="button" disabled="{{c.off}}" onClick="{{c.pick}}" aria-label="{{c.label}}" style="height: 40px; border: 0; padding: 0; background: transparent; font-family: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="{{c.style}}">{{c.n}}</span></button>
</sc-for>
</div>
<p style="margin: -6px 0 0; font-size: 12px; line-height: 16px; color: #5B5666">오늘 이후 날짜는 고를 수 없어요. 1950년 1월부터 고를 수 있어요.</p>
<button type="button" style="height: 56px; border: 0; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">저장</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#1C1A22","#0F8A6B"],"section":"앱"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6D4AE0';
    const s = this.state || {};
    const sel = s.sel || 7;
    // 2026년 4월: 1일은 수요일. 예시라 미래 날짜는 없음 (오늘 이후는 비활성, PRD D-74)
    const cells = [];
    for (let i = 0; i < 3; i++) cells.push({ n: '', off: true, style: '', label: '', pick: null });
    for (let d = 1; d <= 30; d++) {
      const col = (d + 2) % 7;
      const on = d === sel;
      cells.push({
        n: d,
        off: false,
        label: '4월 ' + d + '일' + (on ? ', 선택됨' : ''),
        pick: () => this.setState({ sel: d }),
        style: 'width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 15px; ' + (on ? 'background: ' + accent + '; color: #FFFFFF; font-weight: 700' : 'color: ' + (col === 0 ? '#C93545' : '#1C1A22') + '; font-weight: 500')
      });
    }
    return { accent, cells, monthLabel: '2026년 4월' };
  }
}
</script>
</body>
</html>
