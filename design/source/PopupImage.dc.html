<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팝업 기본 이미지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
<sc-if value="{{show_maintenance}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<svg width="{{size}}" height="{{size}}" aria-hidden="true" viewBox="0 0 120 120" fill="none">
<circle cx="60" cy="60" r="56" fill="#f3f0fd"></circle>
<g fill="#6d4ae0">
<rect x="54" y="25" width="12" height="16" rx="4"></rect>
<rect x="54" y="25" width="12" height="16" rx="4" transform="rotate(45 60 60)"></rect>
<rect x="54" y="25" width="12" height="16" rx="4" transform="rotate(90 60 60)"></rect>
<rect x="54" y="25" width="12" height="16" rx="4" transform="rotate(135 60 60)"></rect>
<rect x="54" y="25" width="12" height="16" rx="4" transform="rotate(180 60 60)"></rect>
<rect x="54" y="25" width="12" height="16" rx="4" transform="rotate(225 60 60)"></rect>
<rect x="54" y="25" width="12" height="16" rx="4" transform="rotate(270 60 60)"></rect>
<rect x="54" y="25" width="12" height="16" rx="4" transform="rotate(315 60 60)"></rect>
<circle cx="60" cy="60" r="23"></circle>
</g>
<circle cx="60" cy="60" r="9" fill="#f3f0fd"></circle>
</svg>
<sc-if value="{{showLabel}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #5B5666">maintenance</span></sc-if>
</div>
</sc-if>
<sc-if value="{{show_error}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<svg width="{{size}}" height="{{size}}" aria-hidden="true" viewBox="0 0 120 120" fill="none">
<circle cx="60" cy="60" r="56" fill="#fdf1e8"></circle>
<path d="M60 31L90 83H30Z" fill="#c93545" stroke="#c93545" stroke-width="10" stroke-linejoin="round"></path>
<path d="M60 50V66" stroke="#ffffff" stroke-width="7" stroke-linecap="round"></path>
<circle cx="60" cy="76" r="4" fill="#ffffff"></circle>
</svg>
<sc-if value="{{showLabel}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #5B5666">error</span></sc-if>
</div>
</sc-if>
<sc-if value="{{show_update}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<svg width="{{size}}" height="{{size}}" aria-hidden="true" viewBox="0 0 120 120" fill="none">
<circle cx="60" cy="60" r="56" fill="#f3f0fd"></circle>
<rect x="40" y="25" width="40" height="70" rx="10" fill="#ffffff" stroke="#6d4ae0" stroke-width="5"></rect>
<path d="M60 72V45M49 56L60 45L71 56" stroke="#6d4ae0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
<rect x="53" y="84" width="14" height="4" rx="2" fill="#d9d4df"></rect>
</svg>
<sc-if value="{{showLabel}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #5B5666">update</span></sc-if>
</div>
</sc-if>
<sc-if value="{{show_notice}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<svg width="{{size}}" height="{{size}}" aria-hidden="true" viewBox="0 0 120 120" fill="none">
<circle cx="60" cy="60" r="56" fill="#f3f0fd"></circle>
<circle cx="60" cy="29" r="5" fill="#6d4ae0"></circle>
<path d="M60 31C47 31 39 41 39 54V66L32 76H88L81 66V54C81 41 73 31 60 31Z" fill="#6d4ae0" stroke="#6d4ae0" stroke-width="4" stroke-linejoin="round"></path>
<path d="M51 81H69A9 9 0 0 1 51 81Z" fill="#4a2fc0"></path>
</svg>
<sc-if value="{{showLabel}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #5B5666">notice</span></sc-if>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"all","options":["all","maintenance","error","update","notice"]},"$preview":{"width":568,"height":188}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'all';
    const all = kind === 'all';
    return {
      size: 112,
      showLabel: all,
      rootStyle: all
        ? 'box-sizing: border-box; width: 568px; height: 188px; padding: 24px; display: flex; gap: 24px; background: #FFFFFF'
        : 'display: flex; width: 112px; height: 112px',
      show_maintenance: all || kind === 'maintenance',
      show_error: all || kind === 'error',
      show_update: all || kind === 'update',
      show_notice: all || kind === 'notice',
    };
  }
}
</script>
</body>
</html>
